[tool.poetry]
name = "rmc"
version = "0.3.2-dev"
description = "Convert to/from v6 .rm files from the reMarkable tablet"
authors = ["Rick Lupton <mail@ricklupton.name>"]
license = "MIT"
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.10"
rmscene = { git = "https://github.com/scrybbling-together/rmscene.git", rev = "0e1a31432e86571aa9e4e8eaa5f8505a55f127c3" }
click = "^8.0"
cairosvg = "^2.8.2"
brotli = "*"
fontTools = "*"

[tool.poetry.dev-dependencies]
pytest = "^7.2.0"

[tool.poetry.scripts]
rmc = 'rmc.cli:cli'

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
